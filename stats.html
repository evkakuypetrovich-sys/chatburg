<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Статистика Chatburg</title><link rel="stylesheet" href="style.css?v=202610112130"></head><body>
<section><div class="wrap"><h2>📊 Статистика сайта</h2><div class="grid" id="s"></div><p class="small">Данные: Abacus API (namespace chatburg-site). Просмотр этой страницы счётчики не увеличивает. Отзывы: <a href="https://github.com/evkakuypetrovich-sys/chatburg/discussions">GitHub Discussions</a>.</p></div></section>
<script>const k={visits:'👀 Визиты',unique:'🧑 Уникальные',like:'👍 Лайки',dislike:'👎 Дизлайки'};for(const[x,t]of Object.entries(k))fetch('https://abacus.jasoncameron.dev/get/chatburg-site/'+x).then(r=>r.ok?r.json():{value:0}).then(j=>s.insertAdjacentHTML('beforeend',`<div class="f"><div class="e">${t}</div><h3 style="font-size:40px">${j.value??0}</h3></div>`))</script></body></html>
